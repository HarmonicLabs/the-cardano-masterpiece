<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Cardano Masterpiece">
  <!-- dark museum mat -->
  <rect width="32" height="32" rx="6" fill="#0d0d10"/>
  <!-- gilded double frame (matches the deed artwork + site gold) -->
  <rect x="3" y="3" width="26" height="26" rx="3" fill="none" stroke="#c9a86a" stroke-width="2.2"/>
  <rect x="6.5" y="6.5" width="19" height="19" rx="1" fill="none" stroke="#c9a86a" stroke-opacity=".38" stroke-width="1"/>
  <!-- the artwork: a gilded pixel mark (the collaborative canvas) -->
  <g fill="#c9a86a">
    <rect x="13.6" y="8.8"  width="4.8" height="4.8"/>
    <rect x="8.8"  y="13.6" width="4.8" height="4.8"/>
    <rect x="18.4" y="13.6" width="4.8" height="4.8"/>
    <rect x="13.6" y="18.4" width="4.8" height="4.8"/>
  </g>
  <rect x="13.6" y="13.6" width="4.8" height="4.8" fill="#e3c98e"/>
</svg>
